[versions]
kotlin = "2.2.20"
agp = "8.13.0"
coroutines = "1.10.2"
serialization = "1.9.0"
junit-jupiter = "5.13.4"
junit-platform = "1.13.4"
androidx-startup = "1.2.0"
# compileOnly ONLY — sidekick compiles against these Compose surfaces but never
# ships them; the host app supplies the runtime version (constitution I).
compose = "1.7.6"
# compileOnly ONLY in sidekick (constitution I); runtime for tests.
okhttp = "4.12.0"
# Relocated into dta-sidekick-rhino; never a plain dependency (constitution I).
rhino = "1.7.15"
shadow = "9.0.2"
# Daemon (host) only — protobuf decoding never reaches the app (feature 006).
# protobuf-java pinned to what opentelemetry-proto's gencode was built with.
protobuf = "4.36.2"
opentelemetry-proto = "1.11.1-alpha"
wire = "6.4.7"  # 7.x pulls kotlin-stdlib 2.3
# CLI only (feature 008). Clikt 5.1 pulls kotlin-stdlib 2.3; the MCP Kotlin SDK pulls 2.4.
clikt = "5.0.3"
mcp = "2.0.1"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }
androidx-startup = { module = "androidx.startup:startup-runtime", version.ref = "androidx-startup" }
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
rhino = { module = "org.mozilla:rhino", version.ref = "rhino" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
protobuf-java-util = { module = "com.google.protobuf:protobuf-java-util", version.ref = "protobuf" }
opentelemetry-proto = { module = "io.opentelemetry.proto:opentelemetry-proto", version.ref = "opentelemetry-proto" }
wire-schema = { module = "com.squareup.wire:wire-schema-jvm", version.ref = "wire" }
clikt = { module = "com.github.ajalt.clikt:clikt", version.ref = "clikt" }
mcp = { module = "io.modelcontextprotocol.sdk:mcp", version.ref = "mcp" }
compose-ui-tooling-data = { module = "androidx.compose.ui:ui-tooling-data", version.ref = "compose" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
android-library = { id = "com.android.library", version.ref = "agp" }
