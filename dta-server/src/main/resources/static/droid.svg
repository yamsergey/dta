<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 696 696" width="696" height="696" role="img" aria-label="The DTA droid, reading a screen"><style>
    .body   { fill: rgba(255,255,255,0.88); }
    .screen { fill: #0a0a0a; }
    .band   { fill: #3dff8f; opacity: .92; }
    .dot    { fill: #3dff8f; animation: blink 1.4s ease-in-out infinite; }
    .sweep  { animation: sweep 5.45s linear infinite; }
    @keyframes sweep { from { transform: translateX(0); } to { transform: translateX(720px); } }
    @keyframes blink { 0%,35% { opacity: 1; } 47%,65% { opacity: .08; } 65.1%,100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .sweep { display: none; } .dot { animation: none; }
    }

    @media (prefers-color-scheme: light) {
      .body { fill: #161615; } .screen { fill: #eceae5; }
      .band, .dot { fill: #067a3c; }
    }
